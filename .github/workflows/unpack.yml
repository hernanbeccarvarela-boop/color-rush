   name: Unpack game zip
   on:
     push:
       paths: ['*.zip']
     workflow_dispatch:
   permissions:
     contents: write
   jobs:
     unpack:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - name: Unpack the zip into the repository
           run: |
             set -e
             ZIP=$(ls *.zip | head -1)
             rm -rf /tmp/unz && mkdir -p /tmp/unz && unzip -q -o "$ZIP" -d /tmp/unz
             rm -rf /tmp/unz/__MACOSX
             SRC=/tmp/unz
             if [ "$(ls -A /tmp/unz | wc -l)" -eq 1 ] && [ -d "/tmp/unz/$(ls -A /tmp/unz)" ]; then SRC="/tmp/unz/$(ls -A /tmp/unz)"; fi
             cp -a "$SRC"/. .
             rm -f "$ZIP"
             git config user.name "github-actions[bot]"
             git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
             git add -A
             git commit -m "Unpack game files" || echo "nothing to commit"
             git push
